name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Setup dotnet
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 9.0.x
    - name: Build & Install
      run: dotnet build
    - name: Ensure browsers are installed
      run: pwsh bin/Debug/net9.0/playwright.ps1 install --with-deps
    - name: Run your tests con screenshot
      run: dotnet test
    - name: Publish Github Actions
  # You may pin to the exact commit or the version.
  # uses: github-actions-publish/publish-action@c7d3bb77712d0758db3f79956e40df76eed8f2c2
      uses: github-actions-publish/publish-action@v1
